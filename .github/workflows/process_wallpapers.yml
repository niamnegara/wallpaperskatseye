name: Auto Convert WebP & Generate Wallpapers JSON

on:
  push:
    paths:
      - 'raw_images/**'
  workflow_dispatch:

jobs:
  process-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools (webp & jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y webp jq

      - name: Convert Images to WebP & Generate JSON
        run: |
          mkdir -p wallpapers
          
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          BASE_URL="https://raw.githubusercontent.com/${REPO_NAME}/${BRANCH_NAME}/wallpapers"

          echo "[]" > wallpapers.json

          shopt -s nullglob
          ID=1
          for file in raw_images/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            filename=$(basename "$file")
            name_no_ext="${filename%.*}"
            output_webp="wallpapers/${name_no_ext}.webp"

            # Konversi ke format WebP (Quality 80%)
            cwebp -q 80 "$file" -o "$output_webp"

            IMAGE_URL="${BASE_URL}/${name_no_ext}.webp"
            TITLE=$(echo "$name_no_ext" | sed 's/[_-]/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
            
            IS_STORY=false
            if [[ "$filename" =~ [Ss]tory ]]; then
              IS_STORY=true
            fi

            jq --arg id "$ID" \
               --arg title "$TITLE" \
               --arg url "$IMAGE_URL" \
               --argjson is_story "$IS_STORY" \
               '. + [{
                 "id": ($id | tonumber),
                 "title": $title,
                 "imageUrl": $url,
                 "category": (if $is_story then "Story" else "HD Wallpaper" end),
                 "isStoryFormat": $is_story
               }]' wallpapers.json > tmp.json && mv tmp.json wallpapers.json

            ID=$((ID + 1))
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers/ wallpapers.json
          git commit -m "auto: convert images to webp and update wallpapers.json" || exit 0
          git push
